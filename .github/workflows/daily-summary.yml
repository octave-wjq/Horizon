name: Daily Horizon Summary

on:
  schedule:
    # GitHub cron is UTC. Times below are Asia/Shanghai (UTC+8):
    #   07:30  primary
    #   08:30  retry if primary missed/failed
    #   09:30  final retry
    # :30 past the hour reduces top-of-hour Actions congestion skips.
    - cron: '30 23 * * *'   # 07:30 Asia/Shanghai
    - cron: '30 0 * * *'    # 08:30 Asia/Shanghai
    - cron: '30 1 * * *'    # 09:30 Asia/Shanghai
  workflow_dispatch:        # Always runs (ignores "already done today" skip)

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes / deploy Pages

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Decide whether to run today
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Use Shanghai calendar date so morning retries share the same "day".
          TODAY=$(TZ=Asia/Shanghai date +'%Y-%m-%d')
          echo "DATE=$TODAY" >> "$GITHUB_ENV"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch → always run"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scheduled retries: skip if today's digest already landed on gh-pages.
          POST_PATH="_posts/${TODAY}-summary-zh.md"
          API="https://api.github.com/repos/${{ github.repository }}/contents/${POST_PATH}?ref=gh-pages"
          code=$(curl -sS -o /tmp/post_meta.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API" || true)

          if [ "$code" = "200" ]; then
            echo "Found existing $POST_PATH on gh-pages (HTTP $code) → skip retry"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful digest for $TODAY yet (HTTP $code) → run"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.gate.outputs.should_run == 'true'
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: uv sync

      - name: Prepare GitHub Actions config
        if: steps.gate.outputs.should_run == 'true'
        run: cp data/config.github.json data/config.json

      - name: Restore previous digests for cross-day dedup
        if: steps.gate.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/_posts data/summaries
          # Pull recent zh digests from gh-pages (summaries/posts are gitignored on main).
          API="https://api.github.com/repos/${{ github.repository }}/contents/_posts?ref=gh-pages"
          curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API" -o /tmp/posts.json || echo '[]' > /tmp/posts.json
          python3 - <<'PY'
          import json, os, base64, urllib.request
          from pathlib import Path
          token = os.environ["GH_TOKEN"]
          try:
              posts = json.loads(Path("/tmp/posts.json").read_text())
          except Exception:
              posts = []
          if not isinstance(posts, list):
              print("No posts list from gh-pages:", type(posts), posts if isinstance(posts, dict) else "")
              raise SystemExit(0)
          zh = sorted(
              [p for p in posts if isinstance(p, dict) and str(p.get("name","")).endswith("-summary-zh.md")],
              key=lambda p: p.get("name",""),
              reverse=True,
          )[:14]
          out = Path("docs/_posts")
          for p in zh:
              url = p.get("download_url")
              name = p.get("name")
              if not url or not name:
                  continue
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}", "User-Agent": "horizon-dedup"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  data = r.read()
              (out / name).write_bytes(data)
              print("restored", name, "bytes", len(data))
          print("restored_count", len(zh))
          PY
          ls -la docs/_posts | head -20
          # Bootstrap / merge seen ledger from restored posts if needed
          uv run python - <<'PY'
          from pathlib import Path
          import re
          from src.storage.manager import StorageManager
          from src.orchestrator import HorizonOrchestrator, _deduplication_url_key

          storage = StorageManager()
          existing = storage.load_seen_items()
          known = {(r.get("url_key"), r.get("title_key")) for r in existing}
          title_re = re.compile(r"^\d+\.\s+\[([^\]]+)\]\((https?://[^)]+)\)", re.M)
          title_only_re = re.compile(r"^\d+\.\s+\[([^\]]+)\]", re.M)
          url_re = re.compile(r"\((https?://[^)\s]+)\)")
          added = 0
          for path in sorted(Path("docs/_posts").glob("*-summary-zh.md")):
              m = re.search(r"(20\d{2}-\d{2}-\d{2})", path.name)
              date = m.group(1) if m else ""
              text = path.read_text(encoding="utf-8", errors="ignore")
              paired = title_re.findall(text)
              if paired:
                  for title, url in paired:
                      url_key = str(_deduplication_url_key(url))
                      title_key = HorizonOrchestrator._normalize_title_key(title)
                      if (url_key, title_key) in known:
                          continue
                      existing.append({
                          "date": date, "title": title, "url": url,
                          "url_key": url_key, "title_key": title_key,
                          "extra_keys": [f"arxiv:{a}" for a in HorizonOrchestrator._extract_arxiv_ids(title, url, text)],
                      })
                      known.add((url_key, title_key))
                      added += 1
              else:
                  for title in title_only_re.findall(text):
                      title_key = HorizonOrchestrator._normalize_title_key(title)
                      if ("", title_key) in known:
                          continue
                      existing.append({
                          "date": date, "title": title, "url": "",
                          "url_key": "", "title_key": title_key,
                          "extra_keys": [f"arxiv:{a}" for a in HorizonOrchestrator._extract_arxiv_ids(title, text)],
                      })
                      known.add(("", title_key))
                      added += 1
          storage.save_seen_items(existing)
          print("seen_bootstrap_added", added, "total", len(existing))
          PY

      - name: Verify required secrets
        if: steps.gate.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: |
          missing=0
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is empty. Set it in repo Settings → Secrets and variables → Actions."
            missing=1
          else
            echo "OPENAI_API_KEY is set (length=${#OPENAI_API_KEY})"
          fi
          if [ -z "$HORIZON_WEBHOOK_URL" ]; then
            echo "::error::HORIZON_WEBHOOK_URL secret is empty. Feishu push will be skipped/fail."
            missing=1
          else
            echo "HORIZON_WEBHOOK_URL is set (length=${#HORIZON_WEBHOOK_URL})"
          fi
          exit "$missing"

      - name: Run Horizon
        if: steps.gate.outputs.should_run == 'true'
        env:
          # Required: OPENAI_API_KEY (Packy/OpenAI-compatible), HORIZON_WEBHOOK_URL (Feishu)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          # Prefer optional PAT for higher GitHub API quota; fall back to workflow token
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: uv run horizon --hours 24

      - name: Persist seen ledger for future cross-day dedup
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          if [ ! -f data/seen_items.json ]; then
            echo "No data/seen_items.json produced; skip commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_items.json
          if git diff --staged --quiet; then
            echo "seen ledger unchanged"
          else
            git commit -m "chore: update seen digest ledger ${{ env.DATE }}"
            git push origin HEAD:main
          fi

      - name: Deploy to GitHub Pages
        if: steps.gate.outputs.should_run == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      - name: Skipped because already delivered today
        if: steps.gate.outputs.should_run != 'true'
        run: |
          echo "Skip: digest for ${{ steps.gate.outputs.today }} already exists on gh-pages."
          echo "No Feishu re-send. Use workflow_dispatch to force a fresh run."
